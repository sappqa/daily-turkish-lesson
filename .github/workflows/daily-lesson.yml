name: Daily Turkish Lesson

on:
  schedule:
    # 06:00 UTC = 1:00 AM Eastern (EST). During daylight saving time (EDT),
    # use "0 5 * * *" instead to keep it at 1:00 AM.
    - cron: "0 6 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and send lesson
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: uv run story_lesson.py